---
grafana_ini:
  security:
    admin_user: admin
    # 平文を置かず環境変数から注入（docs/secret-management.md 参照）
    admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
  # Caddy(https://grafana.home.arpa)経由での提供に合わせる
  server:
    domain: grafana.home.arpa
    root_url: https://grafana.home.arpa/
  metrics:
    enabled: true
  auth.generic_oauth:
    enabled: true
    name: Authelia
    client_id: grafana
    client_secret: "{{ lookup('ansible.builtin.env', 'GRAFANA_OIDC_SECRET') }}"
    scopes: openid profile email groups
    auth_url: https://auth.home.arpa/api/oidc/authorization
    token_url: https://auth.home.arpa/api/oidc/token
    api_url: https://auth.home.arpa/api/oidc/userinfo
    use_pkce: true
    allow_sign_up: true
    groups_attribute_path: groups
    role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
grafana_dashboards:
  - dashboard_id: 15489
    revision_id: 2
    datasource: prometheus
  - dashboard_id: 20138
    revision_id: 1
    datasource: prometheus
  - dashboard_id: 16450
    revision_id: 3
    datasource: prometheus-kube
  - dashboard_id: 15141
    revision_id: 1
    datasource: loki
  # Node Exporter Full（インフラノードのホストメトリクス）
  - dashboard_id: 1860
    revision_id: 37
    datasource: prometheus
  # Prometheus Blackbox Exporter（外形監視）
  - dashboard_id: 7587
    revision_id: 3
    datasource: prometheus
grafana_datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: 'http://localhost:9090'
  - name: prometheus-kube
    type: prometheus
    access: proxy
    url: 'http://192.168.0.232:9090'
  - name: loki
    type: loki
    access: proxy
    url: 'http://192.168.0.233'
