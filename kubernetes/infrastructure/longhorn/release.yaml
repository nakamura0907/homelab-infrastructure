---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  interval: 1h
  timeout: 10m
  values:
    defaultSettings:
      defaultReplicaCount: 2
      backupTarget: "nfs://192.168.0.200:/mnt/data/k8s"
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 2
    ingress:
      enabled: false
